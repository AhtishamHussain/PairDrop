services:
  pairdrop:
    image: ${PAIRDROP_IMAGE}
    container_name: pairdrop
    restart: unless-stopped
    environment:
      NODE_ENV: production
      TZ: UTC
      DEBUG_MODE: "false"
      RATE_LIMIT: "1"
      WS_FALLBACK: "false"
    expose:
      - "3000"
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s

  caddy:
    image: caddy:2.8-alpine
    container_name: pairdrop-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      pairdrop:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true

volumes:
  caddy_data:
  caddy_config:
