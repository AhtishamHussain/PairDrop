# Public, non-secret config only. Never put API keys, tokens, or TURN credentials here.
# Runtime secrets belong in the Render dashboard or GitHub environment "production".
services:
  - type: web
    name: pairdrop
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: RATE_LIMIT
        value: "5"
      - key: DEBUG_MODE
        value: "false"
      - key: WS_FALLBACK
        value: "false"
      - key: RTC_CONFIG
        sync: false
