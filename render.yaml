services:
  - type: web
    name: pairdrop
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: RATE_LIMIT
        value: "5"
      - key: DEBUG_MODE
        value: "false"
      - key: WS_FALLBACK
        value: "false"
